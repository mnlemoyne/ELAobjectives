<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ELA Objective & WIDA Language Target Architect</title>
  <style>
    :root {
      --bg-primary: #FFFFFF;
      --bg-secondary: #F4F5F7;
      --bg-tertiary: #E5E7EB;
      --text-primary: #0A0A0A;
      --text-secondary: #2D3748;
      --text-muted: #4A5568;
      --border-color: #1A202C;
      --accent-primary: #0F172A;
      --accent-text: #FFFFFF;
      --highlight-bg: #FEF08A;
      --highlight-text: #0A0A0A;
      --badge-bg: #E2E8F0;
      --badge-text: #0F172A;
      --focus-ring: #2563EB;
      --card-shadow: 4px 4px 0px #0A0A0A;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
    }

    body.pink-mode {
      --bg-primary: #000000;
      --bg-secondary: #0D0D0D;
      --bg-tertiary: #171717;
      --text-primary: #FFFFFF;
      --text-secondary: #FFD1E8;
      --text-muted: #FF85C0;
      --border-color: #FF1493;
      --accent-primary: #FF007F;
      --accent-text: #000000;
      --highlight-bg: #FFE600;
      --highlight-text: #000000;
      --badge-bg: #00F0FF;
      --badge-text: #000000;
      --focus-ring: #00F0FF;
      --card-shadow: 4px 4px 0px #FF1493;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.5;
      font-size: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: var(--bg-primary);
      border-bottom: 3px solid var(--border-color);
      padding: 0.85rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand-Group {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      cursor: pointer;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    body.pink-mode .brand-title {
      color: #FF1493;
      text-shadow: 0 0 8px rgba(255, 20, 147, 0.35);
    }

    .brand-badge {
      background: var(--badge-bg);
      color: var(--badge-text);
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border: 2px solid var(--border-color);
      text-transform: uppercase;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    /* BUTTONS & PILLS */
    .btn {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border: 2px solid var(--border-color);
      padding: 0.5rem 0.95rem;
      font-size: 0.875rem;
      font-weight: 800;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: all 0.1s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn:hover {
      background-color: var(--accent-primary);
      color: var(--accent-text);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border-color);
    }

    .btn.active {
      background-color: var(--accent-primary);
      color: var(--accent-text);
      box-shadow: 2px 2px 0px var(--border-color);
    }

    body.pink-mode .btn.active {
      border-color: #FFE600;
    }

    .btn-pink-toggle {
      background-color: #000000;
      color: #FF1493;
      border: 2px solid #FF1493;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    body.pink-mode .btn-pink-toggle {
      background-color: #FF1493;
      color: #000000;
      border-color: #FFE600;
      box-shadow: 0 0 12px rgba(255, 20, 147, 0.7);
    }

    .btn-cta {
      background-color: var(--accent-primary);
      color: var(--accent-text);
      font-weight: 900;
    }

    body.pink-mode .btn-cta {
      background-color: #FFE600;
      color: #000000;
      border-color: #FFE600;
    }

    /* LIVE PREVIEW BANNER */
    .live-banner {
      background-color: var(--bg-secondary);
      border-bottom: 2px solid var(--border-color);
      padding: 0.75rem 1.5rem;
      font-size: 0.92rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .live-banner-text {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .token-pill {
      display: inline-block;
      padding: 0.05rem 0.4rem;
      font-weight: 800;
      border-bottom: 2px solid var(--border-color);
      background-color: var(--highlight-bg);
      color: var(--highlight-text);
      margin: 0 0.1rem;
    }

    /* MAIN CONTAINER */
    main {
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 3rem;
    }

    /* SPLASH SCREEN */
    .splash-container {
      max-width: 960px;
      margin: 2.5rem auto;
      text-align: center;
    }

    .splash-title {
      font-size: 2.25rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
      letter-spacing: -0.03em;
    }

    .splash-subtitle {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 2.5rem;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }

    .splash-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.75rem;
      margin-bottom: 2rem;
    }

    .splash-card {
      background-color: var(--bg-secondary);
      border: 3px solid var(--border-color);
      box-shadow: var(--card-shadow);
      padding: 2.25rem 1.75rem;
      text-align: left;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .splash-card:hover {
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0px var(--border-color);
    }

    body.pink-mode .splash-card:hover {
      border-color: #00F0FF;
      box-shadow: 7px 7px 0px #00F0FF;
    }

    .splash-card-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      background-color: var(--accent-primary);
      color: var(--accent-text);
      padding: 0.25rem 0.6rem;
      margin-bottom: 1rem;
      align-self: flex-start;
    }

    .splash-card h2 {
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 0.75rem;
    }

    .splash-card p {
      color: var(--text-secondary);
      font-size: 0.98rem;
      margin-bottom: 1.5rem;
    }

    /* WIZARD STEP BAR */
    .wizard-nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .step-tab {
      flex: 1;
      min-width: 135px;
      padding: 0.65rem 0.75rem;
      background-color: var(--bg-secondary);
      border: 2px solid var(--border-color);
      font-weight: 800;
      font-size: 0.82rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.1s ease;
    }

    .step-tab.active {
      background-color: var(--accent-primary);
      color: var(--accent-text);
      box-shadow: 3px 3px 0px var(--border-color);
    }

    body.pink-mode .step-tab.active {
      border-color: #FFE600;
    }

    .step-tab small {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      opacity: 0.85;
      text-transform: uppercase;
    }

    /* PANELS & CARDS */
    .panel {
      background-color: var(--bg-secondary);
      border: 3px solid var(--border-color);
      box-shadow: var(--card-shadow);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .panel-header {
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 0.85rem;
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .panel-title {
      font-size: 1.35rem;
      font-weight: 900;
    }

    .split-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 960px) {
      .split-grid {
        grid-template-columns: 1fr;
      }
    }

    /* PILL SELECTORS */
    .category-block {
      margin-bottom: 1.25rem;
      border: 2px solid var(--border-color);
      background-color: var(--bg-primary);
      padding: 1rem;
    }

    .category-title {
      font-size: 0.9rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    body.pink-mode .category-title {
      color: #00F0FF;
    }

    .pill-container {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
    }

    .option-pill {
      background-color: var(--bg-secondary);
      color: var(--text-primary);
      border: 2px solid var(--border-color);
      padding: 0.38rem 0.75rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.08s ease;
    }

    .option-pill:hover {
      background-color: var(--bg-tertiary);
      transform: translateY(-1px);
    }

    .option-pill.selected {
      background-color: var(--accent-primary);
      color: var(--accent-text);
      font-weight: 900;
      box-shadow: 2px 2px 0px var(--border-color);
    }

    body.pink-mode .option-pill.selected {
      background-color: #FF1493;
      color: #000000;
      border-color: #FFE600;
    }

    .option-pill.aligned-rec {
      border-color: var(--focus-ring);
      position: relative;
    }

    .option-pill.aligned-rec::after {
      content: "★ CCSS";
      font-size: 0.65rem;
      font-family: var(--font-mono);
      background-color: var(--highlight-bg);
      color: var(--highlight-text);
      padding: 0.05rem 0.3rem;
      margin-left: 0.35rem;
      font-weight: 900;
    }

    /* CUSTOM INPUT BAR */
    .custom-input-box {
      margin-top: 1rem;
      padding: 0.85rem;
      background-color: var(--bg-tertiary);
      border: 2px dashed var(--border-color);
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .custom-input-box label {
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      font-family: var(--font-mono);
      width: 100%;
    }

    input[type="text"], select, textarea {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border: 2px solid var(--border-color);
      padding: 0.55rem 0.75rem;
      font-size: 0.92rem;
      font-family: var(--font-sans);
      font-weight: 600;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      outline: 3px solid var(--focus-ring);
    }

    .custom-input-box input[type="text"] {
      flex: 1;
      min-width: 220px;
    }

    /* CCSS STANDARDS BROWSER */
    .ccss-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .ccss-item {
      background-color: var(--bg-primary);
      border: 2px solid var(--border-color);
      padding: 0.9rem 1rem;
      cursor: pointer;
      transition: all 0.1s ease;
    }

    .ccss-item:hover {
      background-color: var(--bg-tertiary);
    }

    .ccss-item.selected {
      border-width: 3px;
      background-color: var(--bg-secondary);
      box-shadow: 4px 4px 0px var(--border-color);
    }

    body.pink-mode .ccss-item.selected {
      border-color: #FFE600;
      box-shadow: 4px 4px 0px #FF1493;
    }

    .ccss-code {
      font-family: var(--font-mono);
      font-weight: 900;
      font-size: 0.9rem;
      background-color: var(--accent-primary);
      color: var(--accent-text);
      padding: 0.15rem 0.5rem;
      margin-right: 0.5rem;
      display: inline-block;
    }

    .substandards-box {
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px dashed var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .substandard-row {
      font-size: 0.84rem;
      padding: 0.35rem 0.5rem;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      cursor: pointer;
    }

    .substandard-row.selected {
      background-color: var(--highlight-bg);
      color: var(--highlight-text);
      font-weight: 800;
    }

    /* OUTPUT CARDS */
    .outputs-section {
      margin-top: 2rem;
    }

    .output-card {
      background-color: var(--bg-secondary);
      border: 3px solid var(--border-color);
      box-shadow: var(--card-shadow);
      padding: 1.25rem;
      margin-bottom: 1.25rem;
    }

    .output-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .output-card-title {
      font-size: 1.05rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    body.pink-mode .output-card-title {
      color: #FFE600;
    }

    .output-textarea {
      width: 100%;
      min-height: 84px;
      font-size: 1.05rem;
      line-height: 1.5;
      font-weight: 700;
      padding: 0.75rem;
      resize: vertical;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      border: 2px solid var(--border-color);
    }

    /* ADVANCED MATRIX */
    .matrix-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 1.25rem;
    }

    .matrix-cell {
      background-color: var(--bg-secondary);
      border: 2px solid var(--border-color);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .matrix-cell label {
      font-weight: 900;
      font-size: 0.85rem;
      text-transform: uppercase;
      font-family: var(--font-mono);
    }

    body.pink-mode .matrix-cell label {
      color: #00F0FF;
    }

    .wizard-footer-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 2px solid var(--border-color);
    }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background-color: var(--highlight-bg);
      color: var(--highlight-text);
      border: 3px solid var(--border-color);
      box-shadow: var(--card-shadow);
      padding: 0.75rem 1.25rem;
      font-weight: 900;
      z-index: 999;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-Group" onclick="goHome()" title="Return to Splash Screen">
      <span class="brand-title">ELA Objective &amp; WIDA Architect</span>
      <span class="brand-badge">Grades 9–12 CCSS</span>
    </div>
    <div class="header-controls">
      <button class="btn" id="btnSplash" onclick="goHome()">⌂ Entry Splash</button>
      <button class="btn active" id="btnWizardMode" onclick="switchInterfaceMode('wizard')">Wizard Mode</button>
      <button class="btn" id="btnAdvancedMode" onclick="switchInterfaceMode('advanced')">⚡ Advanced Power-User Mode</button>
      <button class="btn btn-pink-toggle" id="btnPinkToggle" onclick="togglePinkMode()">✦ Pink Mode</button>
    </div>
  </header>

  <div class="live-banner" id="livePreviewBanner" style="display:none;">
    <div class="live-banner-text" id="livePreviewContent"></div>
    <div style="display:flex; gap:0.5rem;">
      <button class="btn" onclick="jumpToOutputs()">Jump to Outputs ↓</button>
    </div>
  </div>

  <main id="appRoot"></main>

  <div class="toast" id="toastMsg">Copied to clipboard!</div>

  <script>

    const CONTENT_DB = {

    /********************************************************************
     * 3. HELPER FUNCTIONS & GRAMMAR ENGINE
     ********************************************************************/

    function getIndefiniteArticle(phrase) {
      if (!phrase) return "a";
      const cleaned = phrase.trim();
      const firstWord = cleaned.split(/[\s-]/)[0].replace(/[^a-zA-Z]/g, "");
      if (!firstWord) return "a";
      // Handle acronyms pronounced with initial vowel sound
      const vowelAcronyms = ["MLA", "APA", "IB", "AP", "SAC"];
      if (vowelAcronyms.includes(firstWord.toUpperCase())) return "an";
      if (/^one/i.test(firstWord) || /^uni/i.test(firstWord) || /^eu/i.test(firstWord)) return "a";
      return /^[aeiou]/i.test(firstWord) ? "an" : "a";
    }

    function autoSelectGerundForProduct(product) {
      const p = product.toLowerCase();
      if (p.includes("cea paragraph") || p.includes("essay") || p.includes("summary") || p.includes("synopsis") || p.includes("précis") || p.includes("response") || p.includes("outline") || p.includes("memo") || p.includes("narrative") || p.includes("story") || p.includes("poem") || p.includes("article") || p.includes("bibliography") || p.includes("report") || p.includes("review") || p.includes("proposal")) {
        return "writing";
      }
      if (p.includes("annotated") || p.includes("markup") || p.includes("scansion") || p.includes("marginalia")) {
        return "annotating";
      }
      if (p.includes("diagram") || p.includes("timeline") || p.includes("map") || p.includes("flowchart") || p.includes("spectrum")) {
        return "mapping";
      }
      if (p.includes("seminar") || p.includes("fishbowl") || p.includes("debate") || p.includes("conference") || p.includes("panel") || p.includes("defense") || p.includes("circle")) {
        return "participating in";
      }
      if (p.includes("speech") || p.includes("briefing") || p.includes("presentation") || p.includes("talk") || p.includes("pitch") || p.includes("recitation")) {
        return "delivering";
      }
      if (p.includes("podcast") || p.includes("video")) {
        return "recording";
      }
      if (p.includes("revision") || p.includes("rewrite")) {
        return "revising";
      }
      return "completing";
    }

    function clearManualEdits() {
      state.manualEdits.learningObjective = null;
      state.manualEdits.learningTarget = null;
      state.manualEdits.languageObjectives = {};
    }

    function buildLearningObjectiveString() {
      if (state.manualEdits.learningObjective !== null) {
        return state.manualEdits.learningObjective;
      }
      const art = getIndefiniteArticle(state.product);
      return `Each student will be able to ${state.verb} ${state.content} in ${state.context} by ${state.gerund} ${art} ${state.product}.`;
    }

    function buildLearningTargetString() {
      if (state.manualEdits.learningTarget !== null) {
        return state.manualEdits.learningTarget;
      }
      const art = getIndefiniteArticle(state.product);
      return `I can ${state.verb} ${state.content} in${state.context} in ${art} ${state.product}.`;
    }

    function buildLanguageObjectiveString(scaffoldText, keyId) {
      if (state.manualEdits.languageObjectives[keyId]) {
        return state.manualEdits.languageObjectives[keyId];
      }
      const art = getIndefiniteArticle(state.product);
      return `Each student will be able to ${state.verb} ${state.content} in${state.context} by ${state.gerund} ${art} ${state.product} that uses ${scaffoldText}.`;
    }

    function getCurrentCCSSObject() {
      const strandObj = CCSS_DB[state.ccssStrand];
      if (!strandObj) return null;
      return strandObj.standards.find(s => s.num === state.selectedStandardNum) || strandObj.standards[0];
    }

    function getCurrentCCSSCode() {
      const sub = state.selectedSubstandardCode ? ` (${state.selectedSubstandardCode})` : "";
      return `CCSS.ELA-LITERACY.${state.ccssStrand}.${state.gradeBand}.${state.selectedStandardNum}${sub}`;
    }

    function togglePinkMode() {
      state.pinkMode = !state.pinkMode;
      document.body.classList.toggle("pink-mode", state.pinkMode);
      const btn = document.getElementById("btnPinkToggle");
      btn.textContent = state.pinkMode ? "✦ Pink Mode: ON" : "✦ Pink Mode";
    }

    function goHome() {
      state.view = "splash";
      updateHeaderButtons();
      render();
    }

    function startPathway(pathwayCode) {
      state.pathway = pathwayCode;
      state.view = "wizard";
      state.wizardStep = 1;
      if (pathwayCode === "A") {
        syncStrandFromCCSS();
      }
      updateHeaderButtons();
      render();
    }

    function switchInterfaceMode(mode) {
      state.view = mode;
      updateHeaderButtons();
      render();
    }

    function updateHeaderButtons() {
      document.getElementById("btnWizardMode").classList.toggle("active", state.view === "wizard");
      document.getElementById("btnAdvancedMode").classList.toggle("active", state.view === "advanced");
      document.getElementById("livePreviewBanner").style.display = state.view === "splash" ? "none" : "flex";
    }

    function syncStrandFromCCSS() {
      const mapped = CCSS_DB[state.ccssStrand].mappedStrand;
      if (state.strand !== mapped) {
        state.strand = mapped;
        // Set sensible defaults for that strand
        if (mapped === "Writing") {
          state.content = "defensible claims";
          state.context = "literary analysis writing";
          state.product = "CEA Paragraph";
          state.gerund = "writing";
        } else if (mapped === "Speaking & Listening") {
          state.content = "probing and clarifying questions";
          state.context = "student-led Socratic seminars";
          state.product = "Socratic seminar participation turn";
          state.gerund = "participating in";
        } else if (mapped === "Language Development") {
          state.content = "parallel structure";
          state.context = "single-paragraph analytical drafts";
          state.product = "parallel structure revision";
          state.gerund = "revising";
        } else {
          state.content = "central theme";
          state.context = "novel excerpts";
          state.product = "CEA Paragraph";
          state.gerund = "writing";
        }
        clearManualEdits();
      }
    }

    function updateLiveBanner() {
      const banner = document.getElementById("livePreviewContent");
      if (!banner) return;
      const art = getIndefiniteArticle(state.product);
      banner.innerHTML = `
        <strong>LIVE OBJECTIVE PREVIEW:</strong>
        Each student will be able to <span class="token-pill">${escapeHtml(state.verb)}</span>
        <span class="token-pill">${escapeHtml(state.content)}</span>
        in <span class="token-pill">${escapeHtml(state.context)}</span>
        by <span class="token-pill">${escapeHtml(state.gerund)}</span>${art}
        <span class="token-pill">${escapeHtml(state.product)}</span>.
      `;
    }

    function jumpToOutputs() {
      if (state.view === "wizard") {
        state.wizardStep = state.pathway === "A" ? 6 : 6;
        render();
      }
      const el = document.getElementById("outputsAnchor");
      if (el) el.scrollIntoView({ behavior: "smooth" });
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function showToast(msg) {
      const t = document.getElementById("toastMsg");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2200);
    }

    /********************************************************************
     * 7. WIZARD VIEW RENDERER (PATHWAYS A & B)
     ********************************************************************/

    function renderWizardView() {
      const stepsA = [
        { id: 1, label: "A1: Strand & Grade", sub: `${state.ccssStrand} (${state.gradeBand})` },
        { id: 2, label: "A2: CCSS & Activities", sub: `${state.ccssStrand}.${state.gradeBand}.${state.selectedStandardNum}` },
        { id: 3, label: "A3: Skill & Content", sub: `${state.verb}` },
        { id: 4, label: "A4: Context", sub: `${state.context}` },
        { id: 5, label: "A5: Product/Process", sub: `${state.product}` },
        { id: 6, label: "A6: WIDA & Outputs", sub: "Finalize & Export" }
      ];

      const stepsB = [
        { id: 1, label: "Screen 1: Strand", sub: state.strand },
        { id: 2, label: "Screen 2: Skill & Content", sub: `${state.verb}` },
        { id: 3, label: "Screen 3: Context", sub: state.context },
        { id: 4, label: "Screen 4: Product/Process", sub: state.product },
        { id: 5, label: "Screen 5: Language Scaffolds", sub: state.widaMode === 'universal' ? 'Universal' : 'Tiered EL' },
        { id: 6, label: "Summary & Outputs", sub: "Edit & Copy" }
      ];

      const activeSteps = state.pathway === "A" ? stepsA : stepsB;

      let navHtml = `<div class="wizard-nav">`;
      activeSteps.forEach(st => {
        const isAct = state.wizardStep === st.id ? "active" : "";
        navHtml += `
          <button class="step-tab ${isAct}" onclick="setWizardStep(${st.id})">
            <small>${escapeHtml(st.label)}</small>
            <div style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(st.sub)}</div>
          </button>
        `;
      });
      navHtml += `</div>`;

      let bodyHtml = "";
      if (state.pathway === "A") {
        if (state.wizardStep === 1) bodyHtml = renderScreenA1();
        else if (state.wizardStep === 2) bodyHtml = renderScreenA2();
        else if (state.wizardStep === 3) bodyHtml = renderScreenSkillAndContent(true);
        else if (state.wizardStep === 4) bodyHtml = renderScreenContext();
        else if (state.wizardStep === 5) bodyHtml = renderScreenProduct();
        else if (state.wizardStep === 6) bodyHtml = renderScreenScaffoldsAndOutputs();
      } else {
        if (state.wizardStep === 1) bodyHtml = renderScreenB1();
        else if (state.wizardStep === 2) bodyHtml = renderScreenSkillAndContent(false);
        else if (state.wizardStep === 3) bodyHtml = renderScreenContext();
        else if (state.wizardStep === 4) bodyHtml = renderScreenProduct();
        else if (state.wizardStep === 5) bodyHtml = renderScreenScaffoldsOnly();
        else if (state.wizardStep === 6) bodyHtml = renderOutputsSection();
      }

      const footerNav = `
        <div class="wizard-footer-nav">
          <button class="btn" onclick="prevWizardStep()" ${state.wizardStep === 1 ? "disabled style='opacity:0.4;cursor:not-allowed;'" : ""}>

          <div style="font-family:var(--font-mono); font-size:0.85rem; font-weight:800;">
            Pathway ${state.pathway} • Step ${state.wizardStep} of 6 </div>${
            state.wizardStep < 6
              ? `<button class="btn btn-cta" onclick="nextWizardStep()">Next Step →</button>`
              : `<button class="btn btn-cta" onclick="copyAllOutputs()">📋 Copy All Objectives + Metadata</button>`
          }
        </div>
      `;

      return navHtml + bodyHtml + footerNav;
    }

    function setWizardStep(step) {
      state.wizardStep = step;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function nextWizardStep() {
      if (state.wizardStep < 6) {
        state.wizardStep++;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });

    function prevWizardStep() {
      if (state.wizardStep > 1) {
        state.wizardStep--;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

            </div>

            <div>
              <div class="category-block">
                <div class="category-title">Curated Learning Activities Aligned to ${state.ccssStrand}.${state.gradeBand}.${currentStd.num}</div>
                <p style="font-size:0.86rem; color:var(--text-secondary); margin-bottom:0.85rem;">
                  Select a pre-aligned activity below to populate your objective variables immediately, or click <strong>Next Step →</strong> to customize step-by-step with aligned verbs and content highlighted.
                </p>
                <div style="display:flex; flex-direction:column; gap:0.75rem;">
                  ${(currentStd.activities || []).map((act, idx) => `
                    <div style="border:2px solid var(--border-color); padding:0.85rem; background:var(--bg-secondary);">
                      <div style="font-weight:900; font-size:0.98rem; margin-bottom:0.35rem;">${escapeHtml(act.title)}</div>
                      <div style="font-family:var(--font-mono); font-size:0.78rem; margin-bottom:0.6rem;">
                        Verb: <strong>${escapeHtml(act.verb)}</strong> |
                        Content: <strong>${escapeHtml(act.content)}</strong> |
                        Context: <strong>${escapeHtml(act.context)}</strong> |
                        Product: <strong>${escapeHtml(act.product)}</strong>
                      </div>
                      <button class="btn btn-cta" onclick="applyAlignedActivity(${idx})">
                        Use Activity &amp; Proceed →
                      </button>
                    </div>
                  `).join("")}
                </div>
              </div>

              <div class="category-block">
                <div class="category-title">Pre-Highlighted Standard Recommendations</div>
                <div style="font-size:0.85rem; margin-bottom:0.4rem;"><strong>Aligned Cognitive Operations:</strong> ${currentStd.verbs.join(", ")}</div>
                <div style="font-size:0.85rem; margin-bottom:0.4rem;"><strong>Aligned Content Elements:</strong> ${currentStd.content.join(", ")}</div>
                <div style="font-size:0.85rem;"><strong>Suggested Product:</strong> ${currentStd.product}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function selectCCSSStandard(num) {
      state.selectedStandardNum = num;
      state.selectedSubstandardCode = "";
      const std = getCurrentCCSSObject();
      if (std) {
        if (std.verbs && std.verbs[0]) state.verb = std.verbs[0];
        if (std.content && std.content[0]) state.content = std.content[0];
        if (std.context) state.context = std.context;
        if (std.product) {
          state.product = std.product;
          state.gerund = autoSelectGerundForProduct(std.product);
        }
        clearManualEdits();
      }
      render();
    }

    function selectSubstandard(code) {
      state.selectedSubstandardCode = state.selectedSubstandardCode === code ? "" : code;
      render();
    }

    function applyAlignedActivity(idx) {
      const std = getCurrentCCSSObject();
      const act = std.activities[idx];
      if (!act) return;
      state.verb = act.verb;
      state.content = act.content;
      state.context = act.context;
      state.gerund = act.gerund;
      state.product = act.product;
      clearManualEdits();
      state.wizardStep = 3;
      render();
    }

    // SCREEN B1: PRIMARY ELA STRAND
    function renderScreenB1() {
      const strands = ["Reading", "Writing", "Speaking & Listening", "Language Development"];
      return `
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">SCREEN 1 [STRAND]: Select the Primary ELA Strand being assessed</h2>
            <button class="btn" onclick="startPathway('A')">Switch to Pathway A (CCSS Standard-First)</button>
          </div>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:1rem;">
            ${strands.map(s => `
              <button class="option-pill ${state.strand === s ? 'selected' : ''}"
                      style="padding:1.35rem 1rem; font-size:1.15rem; text-align:center;"
                      onclick="selectStrand('${s}')">
                ${escapeHtml(s)}
              </button>
            `).join("")}
          </div>
          ${renderCustomInputBox("Strand", "e.g., Multimodal Literacy", "strand")}
        </div>
      `;
    }

    function selectStrand(s) {
      state.strand = s;
      // Set sensible defaults when switching strand
      const firstCat = Object.keys(CONTENT_DB[s] || {})[0];
      if (firstCat) state.content = CONTENT_DB[s][firstCat][0];
      const firstCtxCat = Object.keys(CONTEXT_DB[s]?.categories || {})[0];
      if (firstCtxCat) state.context = CONTEXT_DB[s].categories[firstCtxCat][0];

      if (s === "Writing") {
        state.product = "CEA Paragraph";
        state.gerund = "writing";
      } else if (s === "Reading") {
        state.product = "CEA Paragraph";
        state.gerund = "writing";
      } else {
        const firstProdCat = Object.keys(PRODUCT_DB[s] || {})[0];
        if (firstProdCat) {
          state.product = PRODUCT_DB[s][firstProdCat][0];
          state.gerund = autoSelectGerundForProduct(state.product);
        }
      }
      clearManualEdits();
      render();
    }

    // SCREEN 2 (or A3): SKILL & CONTENT (SPLIT-PANEL)
    function renderScreenSkillAndContent(showCCSSHighlights) {
      const currentStd = showCCSSHighlights ? getCurrentCCSSObject() : null;
      const alignedVerbs = currentStd ? currentStd.verbs : [];
      const alignedContent = currentStd ? currentStd.content : [];

      const taxNames = Object.keys(TAXONOMIES);
      const currentTaxLevels = TAXONOMIES[state.taxonomyFramework] || {};
      const strandContentGroups = CONTENT_DB[state.strand] || CONTENT_DB["Reading"];

      return `
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">SCREEN 2: [SKILL] &amp; [CONTENT] (Split-Panel Selector)</h2>
            <div style="display:flex; gap:0.5rem; align-items:center;">
              <span class="brand-badge">Strand: ${escapeHtml(state.strand)}</span>${showCCSSHighlights ? `<span class="brand-badge">${getCurrentCCSSCode()}</span>` : ""}
            </div>
          </div>

          <div class="split-grid">
            <!-- STEP 2A: SKILL -->
            <div>
              <div class="category-block">
                <div class="category-title">Step 2a [SKILL]: What cognitive skill or operation is being assessed?</div>
                <label style="display:block; font-size:0.8rem; font-weight:800; margin-bottom:0.35rem;">Select Cognitive Taxonomy Framework:</label>
                <select style="width:100%; margin-bottom:1rem;" onchange="changeTaxonomyFramework(this.value)">
                  ${taxNames.map(t => `<option value="${escapeHtml(t)}" ${state.taxonomyFramework === t ? 'selected' : ''}>${escapeHtml(t)}</option>`).join("")}
                </select>

                ${Object.keys(currentTaxLevels).map(levelName => `
                  <div style="margin-bottom:0.85rem;">
                    <div style="font-size:0.8rem; font-weight:900; font-family:var(--font-mono); margin-bottom:0.35rem; color:var(--text-secondary);">
                      ${escapeHtml(levelName)}
                    </div>
                    <div class="pill-container">
                      ${currentTaxLevels[levelName].map(v => {
                        const isSel = state.verb === v ? "selected" : "";
                        const isRec = alignedVerbs.includes(v) ? "aligned-rec" : "";
                        return `<button class="option-pill ${isSel}${isRec}" onclick="selectVariable('verb', '${escapeQuotes(v)}')">${escapeHtml(v)}</button>`;
                      }).join("")}
                    </div>
                  </div>
                `).join("")}

                ${renderCustomInputBox("Custom Verb / Cognitive Operation", "e.g., problematize, synthesize, deconstruct", "verb")}
              </div>
            </div>

            <!-- STEP 2B: CONTENT -->
            <div>
              <div class="category-block">
                <div class="category-title">
                  Step 2b [CONTENT]: What are students learning to "${escapeHtml(state.verb || '...')}"?
                </div>
                <div style="max-height:620px; overflow-y:auto; padding-right:0.25rem;">
                  ${Object.keys(strandContentGroups).map(groupTitle => `
                    <div style="margin-bottom:1rem;">
                      <div style="font-size:0.8rem; font-weight:900; font-family:var(--font-mono); margin-bottom:0.35rem; color:var(--text-secondary);">
                        ${escapeHtml(groupTitle)}
                      </div>
                      <div class="pill-container">
                        ${strandContentGroups[groupTitle].map(item => {
                          const isSel = state.content === item ? "selected" : "";
                          const isRec = alignedContent.includes(item) ? "aligned-rec" : "";
                          return `<button class="option-pill ${isSel}${isRec}" onclick="selectVariable('content', '${escapeQuotes(item)}')">${escapeHtml(item)}</button>`;
                        }).join("")}
                      </div>
                    </div>
                  `).join("")}
                </div>

                ${renderCustomInputBox("Custom Discipline-Specific Content", "e.g., chiastic structure in Act III", "content")}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function changeTaxonomyFramework(val) {
      state.taxonomyFramework = val;
      render();
    }

    // SCREEN 3 (or A4): CONTEXT
    function renderScreenContext() {
      const ctxData = CONTEXT_DB[state.strand] || CONTEXT_DB["Reading"];
      return `
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">SCREEN 3 [CONTEXT]: ${escapeHtml(ctxData.prompt)}</h2>
            <span class="brand-badge">Strand: ${escapeHtml(state.strand)}</span>
          </div>

          ${Object.keys(ctxData.categories).map(catName => `
            <div class="category-block">
              <div class="category-title">${escapeHtml(catName)}</div>
              <div class="pill-container">
                ${ctxData.categories[catName].map(item => `
                  <button class="option-pill ${state.context === item ? 'selected' : ''}"
                          onclick="selectVariable('context', '${escapeQuotes(item)}')">
                    ${escapeHtml(item)}
                  </button>
                `).join("")}
              </div>
            </div>
          `).join("")}

          ${renderCustomInputBox("Custom Text Title, Genre, or Context", ctxData.placeholder, "context")}
        </div>
      `;
    }

    // SCREEN 4 (or A5): PRODUCT / PROCESS
    function renderScreenProduct() {
      const prodGroups = PRODUCT_DB[state.strand] || PRODUCT_DB["Reading"];
      return `
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">SCREEN 4 [PRODUCT/PROCESS]: What are students producing or doing to make their thinking visible?</h2>
            <span class="brand-badge">Analytical Default: CEA Paragraph</span>
          </div>

          <div class="category-block">
            <div class="category-title">1. Action Gerund Selector (Auto-selects based on deliverable, or override below)</div>
            <div class="pill-container">
              ${GERUNDS.map(g => `
                <button class="option-pill ${state.gerund === g ? 'selected' : ''}"
                        onclick="selectVariable('gerund', '${escapeQuotes(g)}')">
                  ${escapeHtml(g)}
                </button>
              `).join("")}
            </div>
            ${renderCustomInputBox("Custom Action Gerund", "e.g.,dramatizing, storyboarding, coding", "gerund")}
          </div>

          ${Object.keys(prodGroups).map(groupName => `
            <div class="category-block">
              <div class="category-title">${escapeHtml(groupName)}</div>
              <div class="pill-container">
                ${prodGroups[groupName].map(prod => `
                  <button class="option-pill ${state.product === prod ? 'selected' : ''}"
                          onclick="selectProduct('${escapeQuotes(prod)}')">
                    ${prod === 'CEA Paragraph' ? '★ CEA Paragraph (Analytical Default)' : escapeHtml(prod)}
                  </button>
                `).join("")}
              </div>
            </div>
          `).join("")}

          ${renderCustomInputBox("Custom Product / Deliverable (Singular Noun Phrase)", "e.g., Socratic seminar reflection memo", "product")}
        </div>
      `;
    }

    function selectProduct(prod) {
      state.product = prod;
      state.gerund = autoSelectGerundForProduct(prod);
      clearManualEdits();
      render();
    }

    // SCREEN 5: LANGUAGE SCAFFOLDS
    function renderScreenScaffoldsOnly() {
      return `
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">SCREEN 5 [LANGUAGE SCAFFOLDS]: WIDA-Compatible EL Differentiation</h2>
            <div style="display:flex; gap:0.5rem;">
              <button class="btn ${state.widaMode === 'universal' ? 'active' : ''}" onclick="setWidaMode('universal')">Universal Class Scaffold</button>
              <button class="btn ${state.widaMode === 'tiered' ? 'active' : ''}" onclick="setWidaMode('tiered')">Differentiate by WIDA EL Tier</button>
            </div>
          </div>
          ${renderScaffoldsControlBody()}
        </div>
      `;
    }

    function renderScreenScaffoldsAndOutputs() {
      return renderScreenScaffoldsOnly() + renderOutputsSection();
    }

    function renderScaffoldsControlBody() {
      if (state.widaMode === "universal") {
        return `
          ${Object.keys(SCAFFOLD_DB).map(cat => `
            <div class="category-block">
              <div class="category-title">${escapeHtml(cat)}</div>
              <div class="pill-container">
                ${SCAFFOLD_DB[cat].map(sc => `
                  <button class="option-pill ${state.universalScaffold === sc ? 'selected' : ''}"
                          onclick="selectVariable('universalScaffold', '${escapeQuotes(sc)}')">
                    ${escapeHtml(sc)}
                  </button>
                `).join("")}
              </div>
            </div>
          `).join("")}
          ${renderCustomInputBox("Custom Language Scaffold", "e.g., a bilingual Spanish-English literary device anchor chart", "universalScaffold")}
        `;
      } else {
        const tiers = Object.keys(state.tieredScaffolds);
        const allScaffolds = Object.values(SCAFFOLD_DB).flat();
        return `
          <div class="category-block">
            <div class="category-title">Assign Scaffolds by WIDA EL Proficiency Tier</div>
            <p style="font-size:0.88rem; color:var(--text-secondary); margin-bottom:1rem;">
              Check the WIDA proficiency tiers present in your classroom and choose or type a specific scaffold for each tier.
            </p>
            ${tiers.map((tierName, idx) => `
              <div style="border:2px solid var(--border-color); padding:1rem; margin-bottom:1rem; background:var(--bg-secondary);">
                <label style="display:flex; align-items:center; gap:0.5rem; font-weight:900; margin-bottom:0.65rem; cursor:pointer;">
                  <input type="checkbox" ${state.activeTiers[tierName] ? 'checked' : ''}
                         onchange="toggleWidaTier('${escapeQuotes(tierName)}')" />
                  <span>${escapeHtml(tierName)}</span>
                </label>
                <select style="width:100%; margin-bottom:0.5rem;"
                        onchange="setTierScaffold('${escapeQuotes(tierName)}', this.value)">
                  ${allScaffolds.map(sc => `
                    <option value="${escapeHtml(sc)}" ${state.tieredScaffolds[tierName] === sc ? 'selected' : ''}>
                      ${escapeHtml(sc)}
                    </option>
                  `).join("")}
                </select>
                <div style="display:flex; gap:0.5rem;">
                  <input type="text" id="customTierInput_${idx}" placeholder="Or type custom scaffold for ${escapeHtml(tierName)}..." style="flex:1;" />
                  <button class="btn" onclick="applyCustomTierScaffold('${escapeQuotes(tierName)}', 'customTierInput_${idx}')">+ Set Custom</button>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }
    }

    function setWidaMode(m) {
      state.widaMode = m;
      clearManualEdits();
      render();
    }

    function toggleWidaTier(tierName) {
      state.activeTiers[tierName] = !state.activeTiers[tierName];
      clearManualEdits();
      render();
    }

    function setTierScaffold(tierName, val) {
      state.tieredScaffolds[tierName] = val;
      clearManualEdits();
      render();
    }

    function applyCustomTierScaffold(tierName, inputId) {
      const el = document.getElementById(inputId);
      if (el && el.value.trim()) {
        state.tieredScaffolds[tierName] = el.value.trim();
        clearManualEdits();
        render();
      }
    }

    /********************************************************************
     * 9. ADVANCED POWER-USER MATRIX VIEW
     ********************************************************************/

    function renderAdvancedView() {
      const allVerbs = Array.from(new Set(Object.values(TAXONOMIES).flatMap(group => Object.values(group).flat())));
      const strandContents = Object.values(CONTENT_DB[state.strand] || CONTENT_DB["Reading"]).flat();
      const strandContexts = Object.values((CONTEXT_DB[state.strand] || CONTEXT_DB["Reading"]).categories).flat();
      const strandProducts = Object.values(PRODUCT_DB[state.strand] || PRODUCT_DB["Reading"]).flat();
      const allScaffolds = Object.values(SCAFFOLD_DB).flat();
      const currentStd = getCurrentCCSSObject();

      return `
        <div class="panel">
          <div class="panel-header">
            <h2 class="panel-title">⚡ Advanced Power-User Matrix (Single-Screen All-Variable Controller)</h2>
            <div style="display:flex; gap:0.5rem;">
              <button class="btn" onclick="resetToDefaults()">↺ Reset Defaults</button>
              <button class="btn btn-cta" onclick="copyAllOutputs()">📋 Copy All + Metadata</button>
            </div>
          </div>

          <div class="matrix-grid">
            <!-- 1. STRAND & CCSS ALIGNMENT -->
            <div class="matrix-cell">
              <label>1. Primary ELA Strand &amp; CCSS Standard</label>
              <select onchange="selectStrand(this.value)">
                ${["Reading", "Writing", "Speaking & Listening", "Language Development"].map(s => `
                  <option value="${s}" ${state.strand === s ? 'selected' : ''}>Strand: ${s}</option>
                `).join("")}
              </select>

              <div style="display:flex; gap:0.4rem;">
                <select style="flex:1;" onchange="selectCCSSStrand(this.value)">
                  ${Object.keys(CCSS_DB).map(k => `<option value="${k}" ${state.ccssStrand === k ? 'selected' : ''}>${k}</option>`).join("")}
                </select>
                <select style="flex:1;" onchange="selectGradeBand(this.value)">
                  <option value="9-10" ${state.gradeBand === '9-10' ? 'selected' : ''}>Grades 9–10</option>
                  <option value="11-12" ${state.gradeBand === '11-12' ? 'selected' : ''}>Grades 11–12</option>
                </select>
                <select style="flex:1;" onchange="selectCCSSStandard(this.value)">
                  ${CCSS_DB[state.ccssStrand].standards.map(s => `
                    <option value="${s.num}" ${state.selectedStandardNum === s.num ? 'selected' : ''}>Std .${s.num}</option>
                  `).join("")}
                </select>
              </div>
              <div style="font-size:0.78rem; color:var(--text-secondary);">
                <strong>${getCurrentCCSSCode()}:</strong>${escapeHtml(state.gradeBand === '9-10' ? currentStd.text9_10 : currentStd.text11_12)}
              </div>
            </div>

            <!-- 2. SKILL (VERB) -->
            <div class="matrix-cell">
              <label>2. [SKILL] Cognitive Operation (Verb)</label>
              <select onchange="selectVariable('verb', this.value)">
                ${allVerbs.map(v => `<option value="${escapeHtml(v)}" ${state.verb === v ? 'selected' : ''}>${escapeHtml(v)}</option>`).join("")}
                ${!allVerbs.includes(state.verb) ? `<option value="${escapeHtml(state.verb)}" selected>${escapeHtml(state.verb)} (Custom)</option>` : ""}
              </select>
              <div style="display:flex; gap:0.4rem;">
                <input type="text" id="advCustomVerb" placeholder="+ Custom verb..." style="flex:1;" />
                <button class="btn" onclick="applyAdvCustom('verb', 'advCustomVerb')">Set</button>
              </div>
            </div>

            <!-- 3. CONTENT -->
            <div class="matrix-cell">
              <label>3. [CONTENT] Discipline-Specific Element</label>
              <select onchange="selectVariable('content', this.value)">
                ${strandContents.map(c => `<option value="${escapeHtml(c)}" ${state.content === c ? 'selected' : ''}>${escapeHtml(c)}</option>`).join("")}
                ${!strandContents.includes(state.content) ? `<option value="${escapeHtml(state.content)}" selected>${escapeHtml(state.content)} (Custom)</option>` : ""}
              </select>
              <div style="display:flex; gap:0.4rem;">
                <input type="text" id="advCustomContent" placeholder="+ Custom content..." style="flex:1;" />
                <button class="btn" onclick="applyAdvCustom('content', 'advCustomContent')">Set</button>
              </div>
            </div>

            <!-- 4. CONTEXT -->
            <div class="matrix-cell">
              <label>4. [CONTEXT] Text, Genre, or Format</label>
              <select onchange="selectVariable('context', this.value)">
                ${strandContexts.map(cx => `<option value="${escapeHtml(cx)}" ${state.context === cx ? 'selected' : ''}>${escapeHtml(cx)}</option>`).join("")}
                ${!strandContexts.includes(state.context) ? `<option value="${escapeHtml(state.context)}" selected>${escapeHtml(state.context)} (Custom)</option>` : ""}
              </select>
              <div style="display:flex; gap:0.4rem;">
                <input type="text" id="advCustomContext" placeholder="+ Custom text/context..." style="flex:1;" />
                <button class="btn" onclick="applyAdvCustom('context', 'advCustomContext')">Set</button>
              </div>
            </div>

            <!-- 5. PRODUCT & GERUND -->
            <div class="matrix-cell">
              <label>5. [PRODUCT/PROCESS] Gerund &amp; Deliverable</label>
              <div style="display:flex; gap:0.4rem;">
                <select style="width:38%;" onchange="selectVariable('gerund', this.value)">
                  ${GERUNDS.map(g => `<option value="${escapeHtml(g)}" ${state.gerund === g ? 'selected' : ''}>${escapeHtml(g)}</option>`).join("")}
                  ${!GERUNDS.includes(state.gerund) ? `<option value="${escapeHtml(state.gerund)}" selected>${escapeHtml(state.gerund)}</option>` : ""}
                </select>
                <select style="width:62%;" onchange="selectProduct(this.value)">
                  ${strandProducts.map(p => `<option value="${escapeHtml(p)}" ${state.product === p ? 'selected' : ''}>${escapeHtml(p)}</option>`).join("")}
                  ${!strandProducts.includes(state.product) ? `<option value="${escapeHtml(state.product)}" selected>${escapeHtml(state.product)} (Custom)</option>` : ""}
                </select>
              </div>
              <div style="display:flex; gap:0.4rem;">
                <input type="text" id="advCustomProduct" placeholder="+ Custom product (default: CEA Paragraph)..." style="flex:1;" />
                <button class="btn" onclick="applyAdvCustom('product', 'advCustomProduct')">Set</button>
              </div>
            </div>

            <!-- 6. WIDA LANGUAGE SCAFFOLD -->
            <div class="matrix-cell">
              <label>6. [LANGUAGE SCAFFOLD] WIDA Differentiation</label>
              <div style="display:flex; gap:0.4rem; margin-bottom:0.25rem;">
                <button class="btn ${state.widaMode === 'universal' ? 'active' : ''}" style="flex:1; padding:0.3rem;" onclick="setWidaMode('universal')">Universal</button>
                <button class="btn ${state.widaMode === 'tiered' ? 'active' : ''}" style="flex:1; padding:0.3rem;" onclick="setWidaMode('tiered')">WIDA Tiers 1–6</button>
              </div>
              ${
                state.widaMode === "universal"
                  ? `
                    <select onchange="selectVariable('universalScaffold', this.value)">
                      ${allScaffolds.map(sc => `<option value="${escapeHtml(sc)}" ${state.universalScaffold === sc ? 'selected' : ''}>${escapeHtml(sc)}</option>`).join("")}
                      ${!allScaffolds.includes(state.universalScaffold) ? `<option value="${escapeHtml(state.universalScaffold)}" selected>${escapeHtml(state.universalScaffold)} (Custom)</option>` : ""}
                    </select>
                    <div style="display:flex; gap:0.4rem;">
                      <input type="text" id="advCustomScaffold" placeholder="+ Custom scaffold..." style="flex:1;" />
                      <button class="btn" onclick="applyAdvCustom('universalScaffold', 'advCustomScaffold')">Set</button>
                    </div>
                  `
                  : `<div style="font-size:0.8rem;">Configure individual tiers below or switch to Step 5 in Wizard Mode.</div>`
              }
            </div>
          </div>
        </div>

        ${state.widaMode === "tiered" ? `<div class="panel">${renderScaffoldsControlBody()}</div>` : ""}
        ${renderOutputsSection()}
      `;
    }

    function applyAdvCustom(field, inputId) {
      const el = document.getElementById(inputId);
      if (!el || !el.value.trim()) return;
      const val = el.value.trim();
      state[field] = val;
      if (field === "product") {
        state.gerund = autoSelectGerundForProduct(val);
      }
      clearManualEdits();
      render();
    }

    function resetToDefaults() {
      state.strand = "Reading";
      state.verb = "analyze";
      state.content = "central theme";
      state.context = "novel excerpts";
      state.gerund = "writing";
      state.product = "CEA Paragraph";
      state.universalScaffold = "a color-coded CEA Paragraph graphic organizer with sentence-by-sentence prompts";
      clearManualEdits();
      render();
    }

    /********************************************************************
     * 10. DIRECTLY EDITABLE OUTPUT CARDS & EXPORT ENGINE
     ********************************************************************/

    function renderOutputsSection() {
      const loText = buildLearningObjectiveString();
      const ltText = buildLearningTargetString();

      let langCardsHtml = "";
      if (state.widaMode === "universal") {
        const langStr = buildLanguageObjectiveString(state.universalScaffold, "universal");
        langCardsHtml = `
          <div class="output-card">
            <div class="output-card-header">
              <span class="output-card-title">3. Language Objective (EL-Differentiated &amp; WIDA-Compatible)</span>
              <div style="display:flex; gap:0.5rem;">
                <button class="btn" onclick="resetSingleOutput('lang_universal')">↺ Reset Template</button>
                <button class="btn btn-cta" onclick="copyTextById('outLang_universal')">📋 Copy</button>
              </div>
            </div>
            <textarea class="output-textarea" id="outLang_universal"
                      oninput="recordManualEdit('lang', 'universal', this.value)">${escapeHtml(langStr)}</textarea>
          </div>
        `;
      } else {
        const activeTierNames = Object.keys(state.activeTiers).filter(t => state.activeTiers[t]);
        langCardsHtml = `
          <div class="output-card">
            <div class="output-card-header">
              <span class="output-card-title">3. Differentiated Language Objectives by WIDA EL Proficiency Tier</span>
            </div>
            ${
              activeTierNames.length === 0
                ? `<p style="font-size:0.9rem;">Select at least one WIDA EL Tier above to generate tiered Language Objectives.</p>`
                : activeTierNames.map((tName, idx) => {
                    const keyId = `tier_${idx}`;
                    const scText = state.tieredScaffolds[tName];
                    const lStr = buildLanguageObjectiveString(scText, keyId);
                    return `
                      <div style="margin-bottom:1rem; padding:0.85rem; border:2px solid var(--border-color); background:var(--bg-primary);">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                          <strong style="font-family:var(--font-mono); font-size:0.88rem;">WIDA ${escapeHtml(tName)}</strong>
                          <div style="display:flex; gap:0.4rem;">
                            <button class="btn" onclick="resetSingleOutput('${keyId}')">↺ Reset</button>
                            <button class="btn btn-cta" onclick="copyTextById('outLang_${keyId}')">📋 Copy</button>
                          </div>
                        </div>
                        <textarea class="output-textarea" id="outLang_${keyId}"
                                  oninput="recordManualEdit('lang', '${keyId}', this.value)">${escapeHtml(lStr)}</textarea>
                      </div>
                    `;
                  }).join("")
            }
          </div>
        `;
      }

      return `
        <div class="outputs-section" id="outputsAnchor">
          <div class="panel">
            <div class="panel-header">
              <h2 class="panel-title">Generated Objectives &amp; Direct-Editing Studio</h2>
              <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                <button class="btn" onclick="resetAllTemplates()">↺ Reset All to Generated Template</button>
                <button class="btn btn-cta" onclick="copyAllOutputs()">📋 Copy All (with CCSS &amp; Taxonomy Metadata)</button>
              </div>
            </div>
            <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:1.25rem;">
              <strong>Direct-Editing Enabled:</strong> Click directly inside any box below to tweak phrasing, articles (<em>a/an</em>), or punctuation before copying.
            </p>

            <!-- CARD 1: LEARNING OBJECTIVE -->
            <div class="output-card">
              <div class="output-card-header">
                <span class="output-card-title">1. Learning Objective (Teacher / Admin-Facing)</span>
                <div style="display:flex; gap:0.5rem;">
                  <button class="btn" onclick="resetSingleOutput('lo')">↺ Reset Template</button>
                  <button class="btn btn-cta" onclick="copyTextById('outLO')">📋 Copy</button>
                </div>
              </div>
              <textarea class="output-textarea" id="outLO"
                        oninput="recordManualEdit('lo', null, this.value)">${escapeHtml(loText)}</textarea>
            </div>

            <!-- CARD 2: STUDENT-FACING LEARNING TARGET -->
            <div class="output-card">
              <div class="output-card-header">
                <span class="output-card-title">2. Student-Facing Learning Target</span>
                <div style="display:flex; gap:0.5rem;">
                  <button class="btn" onclick="resetSingleOutput('lt')">↺ Reset Template</button>
                  <button class="btn btn-cta" onclick="copyTextById('outLT')">📋 Copy</button>
                </div>
              </div>
              <textarea class="output-textarea" id="outLT"
                        oninput="recordManualEdit('lt', null, this.value)">${escapeHtml(ltText)}</textarea>
            </div>

            <!-- CARD 3: LANGUAGE OBJECTIVE(S) -->
            ${langCardsHtml}
          </div>
        </div>
      `;
    }

    function recordManualEdit(type, keyId, val) {
      if (type === "lo") state.manualEdits.learningObjective = val;
      else if (type === "lt") state.manualEdits.learningTarget = val;
      else if (type === "lang") state.manualEdits.languageObjectives[keyId] = val;
    }

    function resetSingleOutput(which) {
      if (which === "lo") state.manualEdits.learningObjective = null;
      else if (which === "lt") state.manualEdits.learningTarget = null;
      else if (which === "lang_universal") delete state.manualEdits.languageObjectives["universal"];
      else delete state.manualEdits.languageObjectives[which];
      render();
    }

    function resetAllTemplates() {
      clearManualEdits();
      render();
      showToast("Reverted all boxes to generated template!");
    }

    function copyTextById(id) {
      const el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(el.value).then(() => {
        showToast("Copied to clipboard!");
      });
    }

    function copyAllOutputs() {
      const lo = document.getElementById("outLO") ? document.getElementById("outLO").value : buildLearningObjectiveString();
      const lt = document.getElementById("outLT") ? document.getElementById("outLT").value : buildLearningTargetString();

      let langSection = "";
      if (state.widaMode === "universal") {
        const lVal = document.getElementById("outLang_universal")
          ? document.getElementById("outLang_universal").value
          : buildLanguageObjectiveString(state.universalScaffold, "universal");
        langSection = `LANGUAGE OBJECTIVE (WIDA-Compatible):\n${lVal}`;
      } else {
        const activeTierNames = Object.keys(state.activeTiers).filter(t => state.activeTiers[t]);
        const lines = activeTierNames.map((tName, idx) => {
          const keyId = `tier_${idx}`;
          const domEl = document.getElementById(`outLang_${keyId}`);
          const text = domEl ? domEl.value : buildLanguageObjectiveString(state.tieredScaffolds[tName], keyId);
          return `• WIDA ${tName}:${text}`;
        });
        langSection = `DIFFERENTIATED LANGUAGE OBJECTIVES (WIDA Tiers):\n${lines.join("\n")}`;
      }

      const fullExport = [
        `=== HIGH SCHOOL ELA LESSON OBJECTIVES ===`,
        `Primary ELA Strand: ${state.strand}`,
        `CCSS Alignment: ${getCurrentCCSSCode()}`,
        `Cognitive Taxonomy: ${state.taxonomyFramework} [Operation:${state.verb}]`,
        `Deliverable / Process: ${state.gerund} ${getIndefiniteArticle(state.product)}${state.product}`,
        ``,
        `LEARNING OBJECTIVE (Teacher/Admin-Facing):`,
        lo,
        ``,
        `STUDENT-FACING LEARNING TARGET:`,
        lt,
        ``,
        langSection
      ].join("\n");

      navigator.clipboard.writeText(fullExport).then(() => {
        showToast("Copied All Objectives & Metadata!");
      });
    }

    /********************************************************************
     * 11. UNIVERSAL "+ CREATE A NEW OPTION / CUSTOM FILL-IN" COMPONENT
     ********************************************************************/

    function renderCustomInputBox(labelTitle, placeholderText, stateKey) {
      const inputId = `customInput_${stateKey}`;
      return `
        <div class="custom-input-box">
          <label>+ Create a New Option / Custom Fill-In (${escapeHtml(labelTitle)}):</label>
          <input type="text" id="${inputId}" placeholder="${escapeHtml(placeholderText)}"
                 onkeydown="if(event.key==='Enter') applyCustomInput('${stateKey}', '${inputId}')" />
          <button class="btn btn-cta" onclick="applyCustomInput('${stateKey}', '${inputId}')">
            Apply Custom Option
          </button>
        </div>
      `;
    }

    function applyCustomInput(stateKey, inputId) {
      const el = document.getElementById(inputId);
      if (!el || !el.value.trim()) return;
      const val = el.value.trim();
      state[stateKey] = val;
      if (stateKey === "product") {
        state.gerund = autoSelectGerundForProduct(val);
      }
      clearManualEdits();
      render();
      showToast(`Applied custom ${stateKey}: "${val}"`);
    }

    function selectVariable(key, val) {
      state[key] = val;
      clearManualEdits();
      render();
    }

    function escapeQuotes(str) {
      return String(str).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    // Initialize Application
    render();
  </script>
</body>
</html>
